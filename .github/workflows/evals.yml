name: Agent evals

# Runs the offline eval set through Claude Code and posts per-domain pass rates to the job
# summary. Runs on PRs that touch models, skills or evals, and on demand.
# Needs a repository secret ANTHROPIC_API_KEY; without it the job is skipped.

on:
  workflow_dispatch:
    inputs:
      ablate:
        description: "Component to turn off (blank for none)"
        required: false
        default: ""
        type: choice
        options: ["", "skills"]
  pull_request:
    paths:
      - "models/**"
      - ".claude/**"
      - "evals/**"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip when no API key is configured
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY secret not set; skipping evals." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''

      - uses: actions/setup-python@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        if: env.ANTHROPIC_API_KEY != ''
        with:
          node-version: "22"

      - name: Install Claude Code, dbt and MetricFlow
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install -r requirements.txt

      - name: Cache TPC-H sample data
        if: env.ANTHROPIC_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: data/tpch_sf1
          key: tpch-sf1-${{ hashFiles('scripts/setup_data.py') }}

      - name: Build the warehouse
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          python scripts/setup_data.py
          dbt build --quiet

      - name: Run evals
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          ABLATE="${{ github.event.inputs.ablate }}"
          python evals/run_evals.py ${ABLATE:+--ablate $ABLATE}

      - name: Keep the results
        if: always() && env.ANTHROPIC_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
