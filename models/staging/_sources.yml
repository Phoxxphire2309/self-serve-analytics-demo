version: 2

sources:
  - name: tpch
    description: >
      Raw TPC-H sample data (scale factor 1). Locally this is Parquet generated by
      scripts/setup_data.py; on Snowflake it is the SNOWFLAKE_SAMPLE_DATA.TPCH_SF1 share.
      Both are the same spec-standard data. Raw layer: agents never query it directly.
    database: "{{ 'SNOWFLAKE_SAMPLE_DATA' if target.type == 'snowflake' else target.database }}"
    schema: "{{ 'TPCH_SF1' if target.type == 'snowflake' else 'tpch' }}"
    config:
      meta:
        # Used by dbt-duckdb only: read the local Parquet files in place.
        external_location: "data/tpch_sf1/{name}.parquet"
    tables:
      - name: lineitem
      - name: orders
      - name: customer
      - name: supplier
      - name: nation
      - name: region
